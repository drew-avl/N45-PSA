name: N45 PSA CI

on:
  pull_request:
    branches:
      - master
      - develop
  push:
    branches:
      - master
      - develop

permissions:
  contents: read

jobs:
  php-syntax:
    name: PHP syntax
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate PHP syntax
        run: |
          find . \
            -path './uploads' -prune -o \
            -path './.git' -prune -o \
            -type f -name '*.php' -print0 \
            | xargs -0 -n1 php -l

  database-schema:
    name: Database schema
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: itflow_ci
          MARIADB_USER: itflow
          MARIADB_PASSWORD: itflow
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install MariaDB client and PHP MySQL extension
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-client php-mysql

      - name: Import clean schema
        env:
          MYSQL_PWD: itflow
        run: |
          mariadb \
            --host=127.0.0.1 \
            --user=itflow \
            itflow_ci < db.sql

      - name: Create CI configuration
        run: |
          cat > config.php <<'PHP'
          <?php
          $dbhost = '127.0.0.1';
          $dbusername = 'itflow';
          $dbpassword = 'itflow';
          $database = 'itflow_ci';
          $mysqli = mysqli_connect($dbhost, $dbusername, $dbpassword, $database)
              or die('Database Connection Failed');
          $config_app_name = 'N45 PSA CI';
          $config_base_url = 'localhost';
          $config_https_only = false;
          $repo_branch = 'master';
          $installation_id = 'ci';
          $config_enable_setup = 0;
          PHP

      - name: Validate upstream database updater
        run: php scripts/update_cli.php --update_db

      - name: Validate N45 migrations
        run: php ops/run-n45-migrations.php "$GITHUB_WORKSPACE"

      - name: Verify database version
        run: php ops/verify-db-version.php "$GITHUB_WORKSPACE"
