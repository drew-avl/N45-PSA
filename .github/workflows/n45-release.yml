name: N45 PSA Release

on:
  push:
    tags:
      - 'n45-v*'

permissions:
  contents: write

jobs:
  validate-and-release:
    name: Validate and publish release
    runs-on: ubuntu-24.04

    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: itflow_release
          MARIADB_USER: itflow
          MARIADB_PASSWORD: itflow
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate release tag
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^n45-v[0-9]{4}\.[0-9]{2}\.[0-9]+$ ]]

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mysqli, intl, curl, gd, mbstring, zip, xml
          coverage: none

      - name: Install MariaDB client
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-client

      - name: Validate PHP syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          failed=0

          while IFS= read -r -d '' file; do
            echo "Checking $file"
            if ! php -d display_errors=1 -l "$file"; then
              failed=1
            fi
          done < <(
            find . \
              -path './.git' -prune -o \
              -path './uploads' -prune -o \
              -type f -name '*.php' -print0
          )

          exit "$failed"

      - name: Import current schema
        env:
          MYSQL_PWD: itflow
        run: |
          mariadb \
            --host=127.0.0.1 \
            --user=itflow \
            itflow_release < db.sql

      - name: Create isolated release configuration
        run: |
          cat > config.php <<'PHP'
          <?php
          $dbhost = '127.0.0.1';
          $dbusername = 'itflow';
          $dbpassword = 'itflow';
          $database = 'itflow_release';
          $mysqli = mysqli_connect($dbhost, $dbusername, $dbpassword, $database)
              or die('Database Connection Failed');
          PHP

      - name: Validate N45 migrations and schema version
        run: |
          php ops/run-n45-migrations.php "$GITHUB_WORKSPACE"
          php ops/verify-db-version.php "$GITHUB_WORKSPACE"

      - name: Remove runtime configuration
        run: rm -f config.php

      - name: Build release archive
        run: |
          mkdir -p dist
          tar \
            --exclude='.git' \
            --exclude='dist' \
            --exclude='config.php' \
            -czf "dist/${GITHUB_REF_NAME}.tar.gz" .
          sha256sum "dist/${GITHUB_REF_NAME}.tar.gz" \
            > "dist/${GITHUB_REF_NAME}.sha256"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/${GITHUB_REF_NAME}.tar.gz" \
            "dist/${GITHUB_REF_NAME}.sha256" \
            --generate-notes \
            --verify-tag
